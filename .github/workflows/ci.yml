name: CI

on:
  push:
    branches: [master, refactor/nsgo-migration]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSGo
        run: go install github.com/nsgo-dev/nsgo/cmd/nsgo@v0.3.4

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files --cached --others --exclude-standard '*.go'))"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: NSGo check
        run: nsgo check cmd/ecopaste

      - name: Build development app
        run: nsgo build -id com.ayangweb.eco-paste.dev -output build/dev cmd/ecopaste
